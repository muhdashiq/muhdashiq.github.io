name: Check project links

# Opens every project and code link once a week. If one is broken the run
# fails, and GitHub emails you about it.
on:
  schedule:
    - cron: '23 3 * * 1' # Mondays, 08:53 in India
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The script only needs Node's built-in fetch, so there's nothing to install.
      - run: node --experimental-strip-types scripts/check-links.ts
